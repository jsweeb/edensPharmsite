name: Deploy

# Builds the site on GitHub and uploads the self-contained standalone build to
# Namecheap over FTPS (with lftp), so the host never runs `npm install` or
# `next build`.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR  (optional, default "./"; must end with "/")
#              NEXT_PUBLIC_SITE_URL (optional, default https://edenspharm.com)
# Until the FTP secrets exist, the job builds but skips the upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://edenspharm.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone site
        run: npm run build
      - name: Install lftp
        if: env.HAS_FTP == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      # lftp reconnects and retries when the shared host drops the FTP
      # connection mid-upload, skips files already on the server, and deletes
      # files no longer in the build (except tmp/, logs and .htaccess, which
      # the host manages). tmp/restart.txt goes last so Passenger restarts on
      # the finished site. The `rm` clears a misplaced standalone/ folder left
      # by an earlier deploy.
      - name: Upload to Namecheap
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          # lftp appends the source folder name when the target ends in "/",
          # so strip any trailing slash to upload into the app root itself.
          TARGET="${FTP_SERVER_DIR%/}"
          TARGET="${TARGET:-.}"
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 30
          set net:max-retries 20
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set cmd:fail-exit true
          rm -r -f "$TARGET/standalone"
          mirror --reverse --only-newer --delete --no-perms --parallel=3 --exclude-glob tmp/ --exclude-glob '*.log' --exclude-glob .htaccess --verbose .next/standalone/ "$TARGET"
          mkdir -fp "$TARGET/tmp"
          put -O "$TARGET/tmp" .next/standalone/tmp/restart.txt
          bye
          LFTP
      - name: Upload skipped
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Build succeeded. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to deploy."
