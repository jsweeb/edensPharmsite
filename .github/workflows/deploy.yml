name: Deploy

# Builds the site on GitHub and uploads the self-contained standalone build to
# Namecheap over FTPS, so the host never runs `npm install` or `next build`.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR  (optional, default "./"; must end with "/")
#              NEXT_PUBLIC_SITE_URL (optional, default https://edenspharm.com)
# Until the FTP secrets exist, the job builds but skips the upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://edenspharm.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone site
        run: npm run build
      - name: Upload to Namecheap
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./.next/standalone/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # The action excludes **/node_modules/** by default, but the
          # standalone server needs its traced node_modules to start.
          exclude: |
            **/.git*
            **/.git*/**
      - name: Upload skipped
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Build succeeded. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to deploy."
